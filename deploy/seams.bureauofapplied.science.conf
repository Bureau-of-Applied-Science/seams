seams.bureauofapplied.science {
    encode zstd gzip
    log {
        output file /var/log/caddy/seams.access.log {
            mode 0640
            roll_size 50MiB
            roll_keep 10
            roll_keep_for 2160h
        }
        format filter {
            wrap json
            request>remote_ip ip_mask 24 48
            request>client_ip ip_mask 24 48
            request>headers>Cookie delete
            request>headers>Authorization delete
        }
    }
    reverse_proxy localhost:3010
}
